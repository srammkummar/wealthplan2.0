[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wealthplan-langgraph"
version = "0.1.0"
description = "LangGraph implementation of the WealthPlan financial research buddy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "httpx>=0.28,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "streamlit>=1.40,<2.0",
]

[project.optional-dependencies]
rag = [
    "langchain-cohere>=0.4,<2.0",
    "langchain-pinecone>=0.2,<2.0",
    "pinecone>=6,<8",
]
postgres = [
    "langgraph-checkpoint-postgres>=2,<4",
    "psycopg[binary,pool]>=3.2,<4",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]

[project.scripts]
wealthplan = "wealthplan.cli:main"
wealthplan-ingest = "wealthplan.ingestion.cli:main"
wealthplan-db = "wealthplan.database.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wealthplan"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
